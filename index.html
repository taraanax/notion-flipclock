<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
:root {
  --bg:#ffffff;
  --card:#e5f0fc;
  --text:#98b2da;
}

body {
  margin:0;
  background:var(--bg);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

@font-face {
  font-family: 'HN Condensed', sans-serif;
  src: url('https://github.com/mathew-kurian/GameDB/raw/refs/heads/master/public/fonts/HelveticaNeue-CondensedBold.otf');
  font-weight: 700;
  font-style: normal;
}

.clock { display:flex; gap:16px; }

.digit {
  width:90px;
  height:120px;
  perspective:800px;
  border-radius:18px;
  background:var(--card);
  overflow:hidden;
  position:relative;
}

.inner {
  position:absolute;
  width:100%;
  height:200%;
}

.num {
  height:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: 'HN Condensed', sans-serif;
  font-size:82px;
  font-weight: 200;
  transform: scaleY(1.25);
  color:var(--text);
}

.shadow {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(75, 150, 185, 0.25), transparent 40%, rgba(75, 151, 185, 0.25));
  opacity:0;
}
</style>
</head>

<body>

<div class="clock">
  <div class="digit" id="h1"></div>
  <div class="digit" id="h2"></div>
  <div style="width:20px"></div>
  <div class="digit" id="m1"></div>
  <div class="digit" id="m2"></div>
</div>

<script>
// 👉 REAL bounce easing (easeOutBack)
function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;

  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function createDigit(el, val) {
  const inner = document.createElement("div");
  inner.className = "inner";

  const current = document.createElement("div");
  current.className = "num";
  current.textContent = val;

  const next = document.createElement("div");
  next.className = "num";
  next.textContent = val;

  const shadow = document.createElement("div");
  shadow.className = "shadow";

  inner.appendChild(current);
  inner.appendChild(next);

  el.innerHTML = "";
  el.appendChild(inner);
  el.appendChild(shadow);

  el._inner = inner;
  el._shadow = shadow;
  el._value = val;
  el._animating = false;
}

function animateDigit(el, newVal) {
  if (el._animating || el._value === newVal) return;

  el._animating = true;

  const inner = el._inner;
  const shadow = el._shadow;

  inner.children[1].textContent = newVal;

  let start = null;
  const duration = 650; // 🔥 počasneje

  function frame(ts) {
    if (!start) start = ts;
    let t = (ts - start) / duration;
    if (t > 1) t = 1;

    const e = easeOutBack(t);

    // 👉 overshoot jasno viden
    const translate = e * 110;
    const rotate = e * -75;

    inner.style.transform =
      `translateY(-${translate}%) rotateX(${rotate}deg)`;

    shadow.style.opacity = Math.sin(t * Math.PI) * 0.6;

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      inner.style.transform = "translateY(0) rotateX(0)";
      inner.children[0].textContent = newVal;
      el._value = newVal;
      shadow.style.opacity = 0;
      el._animating = false;
    }
  }

  requestAnimationFrame(frame);
}

function tick() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");

  animateDigit(h1, h[0]);
  animateDigit(h2, h[1]);
  animateDigit(m1, m[0]);
  animateDigit(m2, m[1]);
}

["h1","h2","m1","m2"].forEach(id=>{
  createDigit(document.getElementById(id),"0");
});

// ⏱ update samo na MINUTO (da ni spam flipa)
let lastMinute = null;

setInterval(() => {
  const now = new Date().getMinutes();
  if (now !== lastMinute) {
    lastMinute = now;
    tick();
  }
}, 200);

tick();
</script>

</body>
</html>
